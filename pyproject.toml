[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "1.0.0"
description = "Reproducible credit risk data pipeline with DuckDB, dbt and validated column-level lineage"
requires-python = "==3.12.*"
dependencies = [
    "kagglehub",
    "python-dotenv",
    "duckdb",
    "graphviz",
    "dbt-duckdb",
    "sqlglot>=30.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
notebook = [
    "ipykernel>=7.4.0",
    "pandas>=3.1.1",
]
