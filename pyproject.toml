[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "1.0.0"
description = "Reproducible credit risk data pipeline with DuckDB, dbt and validated column-level lineage"
requires-python = "==3.12.*"
dependencies = [
    "kagglehub",
    "python-dotenv",
    "duckdb",
    "graphviz",
    "dbt-duckdb",
    "sqlglot>=30.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pytest>=9.2.0",
]
notebook = [
    "ipykernel>=7.4.0",
    "pandas>=3.1.1",
]

[tool.uv]
# Install the notebook group by default too, so uv sync/add/remove never
# uninstall the kernel used to open legacy/exploration.ipynb
default-groups = ["dev", "notebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lineage", "tests"]
