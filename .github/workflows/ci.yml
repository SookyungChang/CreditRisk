name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Unit tests
        run: uv run pytest

      # The Kaggle data cannot be downloaded or redistributed here, so the rest of
      # the pipeline runs on synthetic sample data instead of ingest.py.
      - name: Create sample database
        run: uv run python tests/sample_data.py

      - name: dbt build
        working-directory: risk_dbt
        run: uv run dbt deps && uv run dbt build

      # Check only: drawing would need the Graphviz system package
      - name: Column lineage check
        run: uv run python lineage/lineage.py --check-only

      - name: Exploration queries
        run: uv run python explore.py
